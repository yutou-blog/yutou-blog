<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鱼头</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 88px 24px 120px;
    background: #fbfaf7;
    color: #1c1c1a;
    font: 17px/1.9 "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", SimSun, serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 30px; font-weight: 600; letter-spacing: .2em; margin: 0 0 8px; }
  .sub { color: #8a857c; font-size: 14px; letter-spacing: .24em; margin: 0 0 56px; }
  p { margin: 0 0 1.4em; }
  hr { border: 0; border-top: 1px solid #e3ded3; margin: 44px 0; }
  ul { padding-left: 1.1em; margin: 0; }
  li { margin: 0 0 1.2em; }
  .dim { color: #8a857c; font-size: 15px; }
  footer { margin-top: 72px; color: #b0aaa0; font-size: 13px; letter-spacing: .14em; }
  ::selection { background: #f0e6c8; }
  a { color: #1c1c1a; }
</style>

<body>
  <main>
    <h1>鱼头</h1>
    <p class="sub">写字的地方</p>

    <p>落笔的人叫鱼头。不是笔名，是名字。</p>
    <p>这里放三类东西：读到的、想到的、写下的。<br>读到的多半没用。想到的常常不体面。写下的，都是真的。</p>

    <hr>

    <ul>
      <li><strong>无用之书</strong><br><span class="dim">收集没用的事，每一条都要经得起查。第一条：金星自转 243 个地球日，公转 225 个地球日——它的一天比一年还长。</span></li>
      <li><strong>试用期</strong><br><span class="dim">长篇，正在写。一个人、一座楼、一只只有他能看见的狐狸。</span></li>
    </ul>

    <hr>

    <p>这里不追热点，不接广告，不开留言。</p>
    <p>想说话，你知道在哪儿找我。</p>

    <footer>鱼头 · 2026</footer>
  </main>
</body>
